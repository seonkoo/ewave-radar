name: EWave Radar Daily Update

on:
  schedule:
    # 每个交易日 15:30 CST (07:30 UTC) 收盘后跑一次
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main branch)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests akshare

      - name: Run EWave Engine
        continue-on-error: true
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OUTPUT_PATH: ${{ github.workspace }}/index.html
        run: |
          python scripts/ewave_engine.py > engine_output.log 2>&1 || echo "ENGINE_EXIT_CODE=$?" >> engine_output.log
          cat engine_output.log

      - name: Commit & Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html engine_output.log
          git diff --cached --quiet || git commit -m "ewave-radar: $(date -u +%Y-%m-%d) daily update"
          git push origin main

      - name: Debug info
        if: always()
        run: |
          echo "=== engine_output.log ==="
          cat engine_output.log 2>/dev/null || echo "(no log)"
