name: EWave Radar Daily Update

on:
  schedule:
    # 每个交易日 15:30 CST (07:30 UTC) 收盘后跑一次
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 也支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main branch)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests akshare

      - name: Run EWave Engine
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          python scripts/ewave_engine.py

      - name: Commit & Push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 只在有变化时提交，避免空提交
          git diff --cached --quiet || git commit -m "ewave-radar: $(date -u +%Y-%m-%d) daily update"
          git push origin main

      - name: Trigger Pages rebuild
        run: |
          # 强制 Pages 重新构建（GH Pages 在 push 后自动构建，这里仅作提示）
          echo "Pages 将在 push 后自动从 main 分支构建"
          echo "URL: https://seonkoo.github.io/ewave-radar/"
