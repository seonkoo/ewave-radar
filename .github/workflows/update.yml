name: daily ewave update

on:
  schedule:
    - cron: '30 7 * * 1-5'   # 北京时间 15:30 收盘后跑
  workflow_dispatch:           # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run EWave Engine
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OUTPUT_PATH: ${{ github.workspace }}/index.html
        run: python scripts/ewave_engine.py
        continue-on-error: false

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html index_debug.json
          if git diff --cached --quiet; then echo "无新数据，跳过提交"; exit 0; fi
          git commit -m "ewave-radar: $(date -u +%Y-%m-%d) daily update"
          git push origin main
