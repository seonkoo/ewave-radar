name: EWave Radar Daily Update

on:
  schedule:
    # 每个交易日 15:30 CST (07:30 UTC) 收盘后跑一次
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 也支持手动触发

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests akshare

      - name: Run EWave Engine
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          python scripts/ewave_engine.py

      - name: Commit & Push to Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ewave-radar: $(date -u +%Y-%m-%d) daily update" || exit 0
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
